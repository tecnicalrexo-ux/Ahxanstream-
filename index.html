<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahxanstream - Watch Your Favorite Content</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="logo">🎬 Ahxanstream</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#home">Home</a></li>
                <li><a href="#movies">Movies</a></li>
                <li><a href="#series">Series</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <button class="btn-login">Sign In</button>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Welcome to Ahxanstream</h1>
            <p>Your Ultimate Destination for Movies & Series</p>
            <button class="btn-primary">Start Watching</button>
        </div>
    </section>

    <section id="movies" class="content-section">
        <div class="container">
            <h2>Popular Movies</h2>
            <div class="movies-grid" id="moviesGrid">
                <!-- Movies will be loaded here -->
            </div>
        </div>
    </section>

    <section id="series" class="content-section">
        <div class="container">
            <h2>Popular Series</h2>
            <div class="series-grid" id="seriesGrid">
                <!-- Series will be loaded here -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Ahxanstream. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
